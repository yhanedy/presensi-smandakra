<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Presensi & Kedisiplinan Publik - SMAN 2 Karanganyar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS Library untuk Ekspor Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; color: black; font-size: 10pt; }
            .shadow-lg, .shadow-md, .shadow { box-shadow: none !important; }
            .border { border-color: #000 !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col justify-between text-slate-800">

    <!-- HEADER LAPORAN PUBLIK -->
    <header class="bg-blue-900 text-white shadow-md no-print sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="https://lh3.googleusercontent.com/d/1LdR1ARwYVgOGhwtxeZRu73oD5uGHKhKA" onError="this.onerror=null;this.src='https://placehold.co/100x100/003366/ffffff?text=SMADA'" class="w-10 h-10 rounded-full border-2 border-white object-cover" alt="Logo SMAN 2 Karanganyar">
                <div>
                    <h1 class="font-bold text-lg leading-tight">SMAN 2 KARANGANYAR</h1>
                    <p class="text-xs text-blue-200">Portal Transparansi Presensi (Neon Gateway)</p>
                </div>
            </div>
            
            <div class="mt-2 sm:mt-0 flex items-center space-x-2">
                <a href="index.html" class="bg-blue-800 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition border border-blue-700 flex items-center space-x-1.5">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Portal Login Interaktif</span>
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-grow space-y-6">

        <!-- PANEL DASHBOARD KONTROL -->
        <div class="bg-white p-5 rounded-xl shadow-md border border-slate-200 flex flex-wrap justify-between items-center gap-4 no-print">
            <div class="flex flex-wrap items-center gap-4">
                
                <!-- Filter Tanggal -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Pilih Tanggal Laporan</label>
                    <div class="flex items-center space-x-1">
                        <input type="date" id="filter-tanggal" class="border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-mono focus:ring-2 focus:ring-blue-500 outline-none">
                        <button onclick="muatLaporanPublik()" class="bg-blue-900 hover:bg-blue-800 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition flex items-center space-x-1 shadow">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <span>Cari</span>
                        </button>
                    </div>
                </div>

            </div>

            <!-- Tombol Ekspor & Print -->
            <div class="flex items-center space-x-2">
                <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 shadow">
                    <i class="fa-solid fa-print"></i>
                    <span>Cetak Laporan</span>
                </button>
            </div>
        </div>

        <!-- REKAP KELAS UTAMA -->
        <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden space-y-3">
            <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                <h3 class="font-bold text-slate-800 text-sm flex items-center space-x-2">
                    <i class="fa-solid fa-list-check text-blue-600"></i>
                    <span>Data Presensi Terkini</span>
                </h3>
                <span id="label-tanggal-aktif" class="text-xs font-mono font-bold text-blue-900 bg-blue-100 px-2.5 py-1 rounded-full">-</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-xs text-left text-slate-600">
                    <thead class="bg-slate-100 text-slate-700 uppercase font-semibold border-b">
                        <tr>
                            <th class="p-3">NISN</th>
                            <th class="p-3">NAMA SISWA</th>
                            <th class="p-3">KELAS</th>
                            <th class="p-3 text-center text-emerald-700">JAM MASUK</th>
                            <th class="p-3 text-center text-blue-700">JAM PULANG</th>
                            <th class="p-3 text-center">STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-laporan-body" class="divide-y divide-slate-100">
                        <tr><td colspan="6" class="p-4 text-center text-slate-400">Memuat data presensi publik...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <footer class="bg-slate-800 text-slate-400 text-xs text-center py-4 no-print mt-8">
        <p>&copy; 2026 SMAN 2 Karanganyar. All rights reserved.</p>
    </footer>

    <!-- LOGIKA WORKER API -->
    <script>
        const API_URL = 'https://smada-api-gateway.yhanedy.workers.dev';

        window.onload = function() {
            const hariIni = new Date().toISOString().split('T')[0];
            document.getElementById('filter-tanggal').value = hariIni;
            muatLaporanPublik();
        };

        async function muatLaporanPublik() {
            const tgl = document.getElementById('filter-tanggal').value;
            const tbody = document.getElementById('tabel-laporan-body');
            document.getElementById('label-tanggal-aktif').textContent = tgl;

            tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400">Memuat data dari Neon...</td></tr>';

            try {
                const response = await fetch(`${API_URL}/api/presensi?tanggal=${tgl}`);
                const res = await response.json();

                if (res.success && res.data && res.data.length > 0) {
                    tbody.innerHTML = res.data.map(p => `
                        <tr class="hover:bg-slate-50 border-b border-slate-100">
                            <td class="p-3 font-mono">${p.nisn}</td>
                            <td class="p-3 font-bold text-slate-800">${p.nama || '-'}</td>
                            <td class="p-3 font-mono">${p.kelas || '-'}</td>
                            <td class="p-3 text-center font-mono font-bold text-emerald-700">${p.jam_masuk || '-'}</td>
                            <td class="p-3 text-center font-mono font-bold text-blue-700">${p.jam_pulang || '-'}</td>
                            <td class="p-3 text-center">
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-100 text-blue-800">
                                    ${p.status}
                                </span>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400">Tidak ada record presensi pada tanggal ini.</td></tr>';
                }
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-rose-500">Gagal terhubung ke API Gateway.</td></tr>';
            }
        }
    </script>
</body>
</html>
