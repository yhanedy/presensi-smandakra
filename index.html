<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Presensi & Kedisiplinan Digital - SMAN 2 Karanganyar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col justify-between text-slate-800">

    <section id="view-login" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-md w-full overflow-hidden">
            <div class="bg-blue-900 text-white p-6 text-center space-y-2">
                <img src="https://lh3.googleusercontent.com/d/1LdR1ARwYVgOGhwtxeZRu73oD5uGHKhKA" onError="this.onerror=null;this.src='https://placehold.co/100x100/003366/ffffff?text=SMADA'" class="w-16 h-16 mx-auto rounded-full border-2 border-white object-cover" alt="Logo SMAN 2 Karanganyar">
                <h1 class="font-bold text-lg leading-tight">SMAN 2 KARANGANYAR</h1>
                <p class="text-xs text-blue-200">Portal Login Sistem Presensi & Kedisiplinan</p>
            </div>

            <form onsubmit="handleLogin(event)" class="p-6 space-y-4">
                <div id="login-error-alert" class="hidden bg-red-100 border border-red-400 text-red-700 text-xs px-3 py-2 rounded-lg">
                    ID Pengguna atau Password salah. Silakan coba lagi.
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ID Pengguna (NIP / NISN)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 text-xs">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="login-username" required placeholder="Masukkan NISN / Username..." class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 text-xs">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="login-password" required placeholder="Masukkan Password..." class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <button type="submit" id="btn-login" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-2.5 rounded-lg text-xs shadow transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Masuk ke Sistem</span>
                </button>

                <div class="pt-2 border-t border-slate-100 text-center">
                    <p class="text-[11px] text-slate-500">Peran akun ditentukan secara otomatis oleh sistem.</p>
                    <a href="laporan-publik.html" class="inline-block mt-2 text-xs text-blue-600 hover:underline font-semibold">
                        &rarr; Akses Laporan Kehadiran Publik (Tanpa Login)
                    </a>
                </div>
            </form>
        </div>
    </section>

    <footer class="bg-slate-800 text-slate-400 text-xs text-center py-4">
        <p>&copy; 2026 SMAN 2 Karanganyar. All rights reserved.</p>
    </footer>

    <script>
        window.onload = function() {
            const savedUser = localStorage.getItem('smada_user');
            if (savedUser) {
                const user = JSON.parse(savedUser);
                redirectUserByRole(user.role);
            }
        };

        function redirectUserByRole(role) {
            const r = (role || '').toLowerCase();
            if (r === 'piket') window.location.href = 'piket.html';
            else if (r === 'bk') window.location.href = 'bk.html';
            else if (r === 'admin') window.location.href = 'admin.html';
            else if (r === 'superadmin' || r === 'super_admin') window.location.href = 'super-admin.html';
            else if (r === 'siswa') window.location.href = 'siswa.html';
            else alert("Role pengguna tidak terdefinisi!");
        }

        async function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('login-username').value.trim();
            const passwordInput = document.getElementById('login-password').value.trim();
            const errorAlert = document.getElementById('login-error-alert');

            errorAlert.classList.add('hidden');

            try {
                // 1. Cek Tabel Users (Petugas / Admin)
                let { data: usersData } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('username', usernameInput);

                if (usersData && usersData.length > 0) {
                    const user = usersData.find(u => (u.password_hash === passwordInput || u.password === passwordInput));
                    if (user) {
                        localStorage.setItem('smada_user', JSON.stringify(user));
                        redirectUserByRole(user.role);
                        return;
                    }
                }

                // 2. Cek Tabel Siswa
                let { data: dataSiswa } = await supabaseClient
                    .from('siswa')
                    .select('*')
                    .eq('nisn', usernameInput)
                    .eq('password', passwordInput);

                if (dataSiswa && dataSiswa.length > 0) {
                    const siswa = dataSiswa[0];
                    const userSiswa = { ...siswa, role: 'siswa' };
                    localStorage.setItem('smada_user', JSON.stringify(userSiswa));
                    
                    // Simpan Log HP Login Siswa
                    const logs = JSON.parse(localStorage.getItem('smada_hp_logs') || '[]');
                    logs.push({ nisn: siswa.nisn, device: navigator.userAgent, time: getISOTimestampWIB() });
                    localStorage.setItem('smada_hp_logs', JSON.stringify(logs));

                    window.location.href = 'siswa.html';
                    return;
                }

                errorAlert.innerText = "Username / NISN atau Password salah!";
                errorAlert.classList.remove('hidden');

            } catch (err) {
                alert("Terjadi kesalahan sistem: " + err.message);
            }
        }
    </script>
</body>
</html>
