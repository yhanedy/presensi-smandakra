<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Presensi & SSO - SMAN 2 Karanganyar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col justify-between text-slate-800">

    <!-- HEADER / NAVBAR -->
    <header class="bg-blue-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="https://lh3.googleusercontent.com/d/1LdR1ARwYVgOGhwtxeZRu73oD5uGHKhKA" onError="this.onerror=null;this.src='https://placehold.co/100x100/003366/ffffff?text=SMADA'" class="w-10 h-10 rounded-full border-2 border-white object-cover" alt="Logo SMAN 2 Karanganyar">
                <div>
                    <h1 class="font-bold text-lg leading-tight">SMAN 2 KARANGANYAR</h1>
                    <p class="text-xs text-blue-200">Portal SSO Presensi & Kedisiplinan Digital</p>
                </div>
            </div>
            <div>
                <a href="laporan-publik.html" class="bg-blue-800 hover:bg-blue-700 text-white text-xs px-3 py-2 rounded-lg font-semibold transition flex items-center space-x-1.5 shadow">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Laporan Publik</span>
                </a>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="max-w-md mx-auto px-4 py-10 w-full flex-grow flex flex-col justify-center">

        <div class="bg-white rounded-2xl shadow-xl p-6 border border-slate-200 space-y-6">
            
            <div class="text-center space-y-1">
                <h2 class="text-xl font-extrabold text-blue-900">Selamat Datang</h2>
                <p class="text-xs text-slate-500">Silakan pilih jenis akun dan login ke dalam sistem</p>
            </div>

            <!-- TAB SELEKSI STATUS LOGIN (SISWA / GURU) -->
            <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-bold">
                <button onclick="switchLoginType('siswa')" id="tab-btn-siswa" class="w-1/2 py-2 rounded-lg bg-blue-900 text-white transition flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-user-graduate"></i>
                    <span>Siswa</span>
                </button>
                <button onclick="switchLoginType('petugas')" id="tab-btn-petugas" class="w-1/2 py-2 rounded-lg text-slate-600 hover:bg-slate-200 transition flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-user-tie"></i>
                    <span>Guru / Petugas</span>
                </button>
            </div>

            <!-- FORM LOGIN SISWA -->
            <form id="form-login-siswa" onsubmit="eksekusiLogin(event, 'siswa')" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">NISN Siswa</label>
                    <input type="text" id="siswa-nisn" required placeholder="Masukkan NISN..." class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-xs outline-none focus:border-blue-900 font-mono">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                    <div class="relative">
                        <input type="password" id="siswa-password" required placeholder="Password..." class="w-full border border-slate-300 rounded-lg pl-3 pr-10 py-2.5 text-xs outline-none focus:border-blue-900 font-mono">
                        <button type="button" onclick="togglePasswordVisibility('siswa-password', 'eye-icon-siswa')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                            <i id="eye-icon-siswa" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" id="btn-submit-siswa" class="w-full bg-blue-900 hover:bg-blue-950 text-white font-bold py-2.5 rounded-lg text-xs transition shadow flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Masuk Akun Siswa</span>
                </button>
            </form>

            <!-- FORM LOGIN GURU / PETUGAS -->
            <form id="form-login-petugas" onsubmit="eksekusiLogin(event, 'petugas')" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Username / NIP</label>
                    <input type="text" id="petugas-user" required placeholder="Masukkan NIP atau Username..." class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-xs outline-none focus:border-blue-900 font-mono">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                    <div class="relative">
                        <input type="password" id="petugas-pass" required placeholder="Password..." class="w-full border border-slate-300 rounded-lg pl-3 pr-10 py-2.5 text-xs outline-none focus:border-blue-900 font-mono">
                        <button type="button" onclick="togglePasswordVisibility('petugas-pass', 'eye-icon-petugas')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                            <i id="eye-icon-petugas" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" id="btn-submit-petugas" class="w-full bg-indigo-900 hover:bg-indigo-950 text-white font-bold py-2.5 rounded-lg text-xs transition shadow flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Masuk Akun Guru / Petugas</span>
                </button>
            </form>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-800 text-slate-400 text-xs text-center py-4">
        <p>&copy; 2026 SMAN 2 Karanganyar. All rights reserved.</p>
    </footer>

    <!-- MODAL POP-UP SELEKSI PERAN (MULTI-ROLE SSO GURU) -->
    <div id="modal-pilih-peran" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-5 border border-slate-200">
            <div class="text-center space-y-1">
                <span class="bg-blue-100 text-blue-800 text-[10px] font-bold uppercase px-2.5 py-1 rounded-full">Single Sign-On SMADA</span>
                <h3 class="text-lg font-extrabold text-slate-800 mt-2">Selamat Datang!</h3>
                <p id="nama-guru-login" class="text-sm font-bold text-blue-900 font-mono">-</p>
                <p class="text-xs text-slate-500">Silakan pilih modul aplikasi yang ingin Anda akses hari ini:</p>
            </div>

            <!-- GRID KOTAK BOX PILIHAN PERAN -->
            <div class="grid grid-cols-2 gap-3" id="container-opsi-peran">
                
                <!-- Box 1: Guru Mapel (Jurnal Mengajar) -->
                <button onclick="bukaModulJurnal()" id="btn-role-mapel" class="hidden p-4 rounded-xl border border-emerald-200 bg-emerald-50/60 hover:bg-emerald-100 transition flex flex-col items-center text-center space-y-2 group shadow-sm">
                    <div class="w-10 h-10 rounded-full bg-emerald-600 text-white flex items-center justify-center text-lg shadow group-hover:scale-110 transition">
                        <i class="fa-solid fa-book-bookmark"></i>
                    </div>
                    <div>
                        <strong class="block text-xs text-emerald-900 font-bold">Jurnal Mengajar</strong>
                        <span class="text-[10px] text-emerald-700">KBM & Presensi Kelas</span>
                    </div>
                </button>

                <!-- Box 2: Guru Piket -->
                <button onclick="bukaModul('piket.html')" id="btn-role-piket" class="hidden p-4 rounded-xl border border-blue-200 bg-blue-50/60 hover:bg-blue-100 transition flex flex-col items-center text-center space-y-2 group shadow-sm">
                    <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center text-lg shadow group-hover:scale-110 transition">
                        <i class="fa-solid fa-clipboard-user"></i>
                    </div>
                    <div>
                        <strong class="block text-xs text-blue-900 font-bold">Guru Piket</strong>
                        <span class="text-[10px] text-blue-700">Presensi GPS Sekolah</span>
                    </div>
                </button>

                <!-- Box 3: BK / STP2K -->
                <button onclick="bukaModul('bk.html')" id="btn-role-bk" class="hidden p-4 rounded-xl border border-purple-200 bg-purple-50/60 hover:bg-purple-100 transition flex flex-col items-center text-center space-y-2 group shadow-sm">
                    <div class="w-10 h-10 rounded-full bg-purple-600 text-white flex items-center justify-center text-lg shadow group-hover:scale-110 transition">
                        <i class="fa-solid fa-handshake-angle"></i>
                    </div>
                    <div>
                        <strong class="block text-xs text-purple-900 font-bold">BK - STP2K</strong>
                        <span class="text-[10px] text-purple-700">Catatan Kedisiplinan</span>
                    </div>
                </button>

                <!-- Box 4: Administrator / Super Admin -->
                <button onclick="bukaModulAdmin()" id="btn-role-admin" class="hidden p-4 rounded-xl border border-amber-200 bg-amber-50/60 hover:bg-amber-100 transition flex flex-col items-center text-center space-y-2 group shadow-sm">
                    <div class="w-10 h-10 rounded-full bg-amber-600 text-white flex items-center justify-center text-lg shadow group-hover:scale-110 transition">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <div>
                        <strong class="block text-xs text-amber-900 font-bold">Administrator</strong>
                        <span class="text-[10px] text-amber-700">Kelola Data & Setting</span>
                    </div>
                </button>

            </div>

            <button onclick="batalPilihRole()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 rounded-xl text-xs transition">
                Batal / Logout
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIKA LOGIN NEON VIA WORKER -->
    <script>
        // URL Backend Cloudflare Worker Anda
        const API_URL = 'https://smada-api-gateway.yhanedy.workers.dev';

        // SWAP TAB GURU / SISWA
        function switchLoginType(type) {
            const btnSiswa = document.getElementById('tab-btn-siswa');
            const btnPetugas = document.getElementById('tab-btn-petugas');
            const formSiswa = document.getElementById('form-login-siswa');
            const formPetugas = document.getElementById('form-login-petugas');

            if (type === 'siswa') {
                btnSiswa.className = "w-1/2 py-2 rounded-lg bg-blue-900 text-white transition flex items-center justify-center space-x-1.5";
                btnPetugas.className = "w-1/2 py-2 rounded-lg text-slate-600 hover:bg-slate-200 transition flex items-center justify-center space-x-1.5";
                formSiswa.classList.remove('hidden');
                formPetugas.classList.add('hidden');
            } else {
                btnPetugas.className = "w-1/2 py-2 rounded-lg bg-indigo-900 text-white transition flex items-center justify-center space-x-1.5";
                btnSiswa.className = "w-1/2 py-2 rounded-lg text-slate-600 hover:bg-slate-200 transition flex items-center justify-center space-x-1.5";
                formPetugas.classList.remove('hidden');
                formSiswa.classList.add('hidden');
            }
        }

        // TOGGLE MATA PASSWORD
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input && icon) {
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            }
        }

        // FUNGSI UTAMA EKSEKUSI LOGIN (SISWA & GURU)
        async function eksekusiLogin(event, jenisUser) {
            event.preventDefault();
            
            let username = '';
            let password = '';
            let btnSubmit = null;

            if (jenisUser === 'siswa') {
                username = document.getElementById('siswa-nisn').value.trim();
                password = document.getElementById('siswa-password').value.trim();
                btnSubmit = document.getElementById('btn-submit-siswa');
            } else {
                username = document.getElementById('petugas-user').value.trim();
                password = document.getElementById('petugas-pass').value.trim();
                btnSubmit = document.getElementById('btn-submit-petugas');
            }

            if (!username || !password) {
                alert('Silakan isi NIP/NISN dan Password terlebih dahulu!');
                return;
            }

            btnSubmit.disabled = true;
            const originalText = btnSubmit.innerHTML;
            btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>Memeriksa...</span>`;

            try {
                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (result.success) {
                    if (result.type === 'guru') {
                        prosesLoginPetugasSukses(result.user);
                    } else {
                        // Bersihkan sesi guru & simpan sesi siswa
                        localStorage.removeItem('smada_user');
                        localStorage.setItem('smada_siswa', JSON.stringify(result.user));
                        setTimeout(() => { window.location.replace('siswa.html'); }, 300);
                    }
                } else {
                    alert("Login Gagal: " + result.message);
                }
            } catch (err) {
                alert("Terjadi kesalahan koneksi ke server: " + err.message);
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = originalText;
            }
        }
        async function handleLoginGuru(event) {
    event.preventDefault();
    const usernameInput = document.getElementById('guru-username').value.trim();
    const passwordInput = document.getElementById('guru-password').value.trim();

    try {
        // Panggil Cloudflare Worker API
        const response = await fetch(`https://smada-api-gateway.yhanedy.workers.dev/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: usernameInput,
                password: passwordInput,
                type: 'guru'
            })
        });

        const result = await response.json();

        if (result.success && result.user) {
            // Simpan sesi login di LocalStorage
            localStorage.setItem('smada_user', JSON.stringify(result.user));

            // Arahkan halaman sesuai Role
            const role = String(result.user.role).toLowerCase();
            if (role === 'superadmin' || role === 'super_admin') {
                window.location.href = 'super-admin.html';
            } else if (role === 'admin') {
                window.location.href = 'admin.html';
            } else if (role === 'bk') {
                window.location.href = 'bk.html';
            } else {
                window.location.href = 'piket.html';
            }
        } else {
            alert("Login Gagal: NIP/Username atau Password Salah");
        }
    } catch (err) {
        alert("Terjadi kesalahan koneksi ke server API Gateway.");
    }
}
        // PROSES SETELAH VERIFIKASI LOGIN PETUGAS BERHASIL
        function prosesLoginPetugasSukses(user) {
            localStorage.setItem('smada_user', JSON.stringify(user));

            const roles = (user.role || '').split(',').map(r => r.trim().toLowerCase());

            if (roles.length === 1) {
                if (roles[0] === 'mapel' || roles[0] === 'guru') {
                    bukaModulJurnal();
                } else if (roles[0] === 'piket') {
                    window.location.href = 'piket.html';
                } else if (roles[0] === 'bk' || roles[0] === 'stp2k') {
                    window.location.href = 'bk.html';
                } else if (roles[0] === 'admin' || roles[0] === 'superadmin' || roles[0] === 'super_admin') {
                    bukaModulAdmin();
                } else {
                    bukaModulAdmin();
                }
                return;
            }

            // Tampilkan Modal Multi-Role jika Guru punya lebih dari 1 role
            document.getElementById('nama-guru-login').textContent = user.nama || user.username;

            document.getElementById('btn-role-mapel').classList.add('hidden');
            document.getElementById('btn-role-piket').classList.add('hidden');
            document.getElementById('btn-role-bk').classList.add('hidden');
            document.getElementById('btn-role-admin').classList.add('hidden');

            if (roles.includes('mapel') || roles.includes('guru')) {
                document.getElementById('btn-role-mapel').classList.remove('hidden');
            }
            if (roles.includes('piket')) {
                document.getElementById('btn-role-piket').classList.remove('hidden');
            }
            if (roles.includes('bk') || roles.includes('stp2k')) {
                document.getElementById('btn-role-bk').classList.remove('hidden');
            }
            if (roles.includes('admin') || roles.includes('superadmin') || roles.includes('super_admin')) {
                document.getElementById('btn-role-admin').classList.remove('hidden');
            }

            document.getElementById('modal-pilih-peran').classList.remove('hidden');
        }

        function bukaModul(halaman) {
            window.location.href = halaman;
        }

        function bukaModulAdmin() {
            const user = JSON.parse(localStorage.getItem('smada_user'));
            if (user && (user.role.includes('superadmin') || user.role.includes('super_admin'))) {
                window.location.href = 'manajemen-siswa.html';
            } else {
                window.location.href = 'manajemen-siswa.html';
            }
        }

        function bukaModulJurnal() {
            const user = JSON.parse(localStorage.getItem('smada_user'));
            if (!user) return alert("Sesi login berakhir. Silakan login kembali.");

            const payload = {
                nip: user.username,
                nama: user.nama,
                role: user.role,
                time: Date.now()
            };

            const tokenSesi = btoa(JSON.stringify(payload));
            window.location.href = `https://yhanedy.github.io/jurnalmengajar/index.html?sso_token=${encodeURIComponent(tokenSesi)}`;
        }

        function batalPilihRole() {
            localStorage.removeItem('smada_user');
            document.getElementById('modal-pilih-peran').classList.add('hidden');
        }
    </script>
</body>
</html>
