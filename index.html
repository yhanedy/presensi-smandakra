<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Presensi & Kedisiplinan - SMAN 2 Karanganyar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Konfigurasi Turso Engine Direct API -->
    <script src="js/config.js?v=index_turso_final"></script>
    <style>
        .bg-school-overlay {
            background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.90)), 
                              url('https://lh3.googleusercontent.com/d/1qqhX88M3FtfF07-qQbiIz_aCuJ5VNds5');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-slate-900 font-sans min-h-screen flex flex-col justify-between text-slate-800 bg-school-overlay">

    <!-- HEADER NAVIGATION BAR -->
    <header class="w-full bg-slate-900/60 backdrop-blur-md border-b border-slate-700/50 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="https://lh3.googleusercontent.com/d/1YQYf0kgtLInAzpSJKJ_3Da86dIoVXU6n" 
                     onError="this.onerror=null;this.src='https://placehold.co/100x100/003366/ffffff?text=SMADA'" 
                     class="w-10 h-10 object-contain drop-shadow" 
                     alt="Logo SMAN 2 Karanganyar">
                <div class="text-left text-white">
                    <h1 class="font-black text-sm sm:text-base tracking-wide leading-tight">SMAN 2 KARANGANYAR</h1>
                    <p class="text-[11px] text-blue-300 font-medium">Sistem Presensi & Kedisiplinan Digital</p>
                </div>
            </div>

            <div>
                <a href="laporan-publik.html" class="bg-blue-600/30 hover:bg-blue-600/50 text-blue-200 border border-blue-400/40 px-3.5 py-1.5 rounded-xl text-xs font-semibold transition flex items-center space-x-1.5 shadow">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Laporan Publik</span>
                </a>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA: CARD LOGIN UTAMA -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl max-w-md w-full p-8 space-y-6 border border-white/20 text-left relative">
            
            <!-- LOGO DAN HEADING PORTAL -->
            <div class="text-center space-y-2">
                <div class="inline-block p-2 bg-blue-50 rounded-full border border-blue-100 mb-1">
                    <img src="https://lh3.googleusercontent.com/d/1YQYf0kgtLInAzpSJKJ_3Da86dIoVXU6n" 
                         onError="this.onerror=null;this.src='https://placehold.co/100x100/003366/ffffff?text=SMADA'" 
                         class="w-16 h-16 object-contain mx-auto" 
                         alt="Logo SMAN 2 Karanganyar">
                </div>
                <h2 class="text-2xl font-black text-slate-900 tracking-tight">PORTAL LOGIN INTEGRASI</h2>
                <p class="text-xs text-slate-500 font-medium">Masukkan Username/NISN/NIP & Password Akun Anda</p>
            </div>

            <!-- FORM LOGIN MULTI-ROLE -->
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Username / NISN / NIP</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-user-gear"></i>
                        </span>
                        <input type="text" id="input-username" required placeholder="Ketik NISN atau NIP/Username..." class="w-full pl-10 pr-3 py-2.5 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none font-mono">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <!-- INPUT PASSWORD DENGAN TOMBOL MATA INTI -->
                        <input type="password" id="input-password" required placeholder="••••••••" class="w-full pl-10 pr-10 py-2.5 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-700 transition focus:outline-none">
                            <i id="icon-toggle-password" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- NOTIFIKASI ERROR -->
                <div id="error-msg" class="hidden p-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-700 font-semibold space-x-1.5 flex items-center">
                    <i class="fa-solid fa-circle-exclamation text-red-500"></i>
                    <span id="error-text"></span>
                </div>

                <!-- TOMBOL LOGIN -->
                <button type="submit" id="btn-login" class="w-full py-3 bg-gradient-to-r from-blue-900 via-blue-800 to-indigo-900 hover:from-blue-800 hover:to-indigo-800 text-white font-bold rounded-xl text-xs transition shadow-lg flex items-center justify-center space-x-2 cursor-pointer">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Masuk Ke Portal</span>
                </button>
            </form>

            <div class="text-center pt-2 border-t border-slate-100">
                <a href="laporan-publik.html" class="text-xs text-blue-700 hover:text-blue-900 font-bold transition inline-flex items-center space-x-1">
                    <i class="fa-solid fa-eye"></i>
                    <span>Lihat Rekap Presensi & Kedisiplinan Publik</span>
                </a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="w-full bg-slate-900/80 backdrop-blur-md border-t border-slate-800 py-4 text-center text-xs text-slate-400">
        <p>&copy; yhanedy@2026 SMAN 2 Karanganyar. All rights reserved.</p>
    </footer>

    <!-- LOGIKA JAVASCRIPT PEMROSES LOGIN MULTI-ROLE & SHOW/HIDE PASSWORD -->
    <script>
        // FUNGSI TAMPILKAN / SEMBUNYIKAN PASSWORD (MATA)
        function togglePasswordVisibility() {
            const passInput = document.getElementById('input-password');
            const toggleIcon = document.getElementById('icon-toggle-password');

            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('input-username').value.trim();
            const passwordInput = document.getElementById('input-password').value.trim();
            const errorBox = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');
            const btnLogin = document.getElementById('btn-login');

            errorBox.classList.add('hidden');
            btnLogin.disabled = true;
            btnLogin.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Memeriksa Akun...</span>`;

            try {
                // 1. CEK KHUSUS SUPER ADMIN (HARDCODED RAHASIA)
                if (usernameInput === 'superadmin' && passwordInput === 'Indonesia22') {
                    localStorage.setItem('smada_user', JSON.stringify({
                        username: 'superadmin',
                        nama: 'System Administrator (Root)',
                        role: 'super_admin'
                    }));

                    window.location.replace('super-admin.html');
                    return;
                }

                // 2. CEK LOGIN GURU / ADMIN / PETUGAS (DATABASE TURSO)
                const userMatch = await queryTurso(
                    'SELECT * FROM users WHERE username = ? AND password_hash = ? LIMIT 1',
                    [usernameInput, passwordInput]
                );

                if (userMatch && userMatch.length > 0) {
                    const user = userMatch[0];
                    const roleStr = String(user.role || '').toLowerCase();

                    localStorage.setItem('smada_user', JSON.stringify({
                        username: user.username,
                        nama: user.nama,
                        role: user.role
                    }));

                    if (roleStr.includes('superadmin') || roleStr.includes('super_admin')) {
                        window.location.replace('super-admin.html');
                    } else if (roleStr.includes('admin')) {
                        window.location.replace('admin.html');
                    } else if (roleStr.includes('piket')) {
                        window.location.replace('piket.html');
                    } else if (roleStr.includes('bk') || roleStr.includes('stp2k')) {
                        window.location.replace('bk.html');
                    } else {
                        window.location.replace('piket.html');
                    }
                    return;
                }

                // 3. CEK LOGIN SISWA MANDIRI (DATABASE TURSO)
                const siswaMatch = await queryTurso(
                    'SELECT * FROM siswa WHERE nisn = ? AND password = ? LIMIT 1',
                    [usernameInput, passwordInput]
                );

                if (siswaMatch && siswaMatch.length > 0) {
                    const siswa = siswaMatch[0];

                    localStorage.setItem('smada_siswa', JSON.stringify({
                        id: siswa.id,
                        nisn: siswa.nisn,
                        nama: siswa.nama,
                        kelas: siswa.kelas
                    }));

                    window.location.replace('siswa.html');
                    return;
                }

                throw new Error("Username/NISN atau Password tidak ditemukan!");

            } catch (err) {
                errorText.textContent = err.message;
                errorBox.classList.remove('hidden');
            } finally {
                btnLogin.disabled = false;
                btnLogin.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> <span>Masuk Ke Portal</span>`;
            }
        }
    </script>
</body>
</html>
