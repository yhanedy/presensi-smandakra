<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal SSO Presensi & Kedisiplinan Digital - SMAN 2 Karanganyar</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
</head>
<body class="bg-slate-900 font-sans min-h-screen flex flex-col justify-between text-slate-800">

  <!-- HEADER -->
  <header class="bg-blue-950/80 backdrop-blur-md border-b border-blue-900/50 text-white sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-blue-950 font-bold text-xl shadow-md">
          <i class="bi bi-shield-check"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">SMAN 2 KARANGANYAR</h1>
          <p class="text-xs text-blue-200">Portal SSO Presensi & Kedisiplinan Digital</p>
        </div>
      </div>
      <a href="laporan-publik.html" class="text-xs bg-blue-900/60 hover:bg-blue-800 text-blue-100 px-3 py-2 rounded-lg border border-blue-700/50 flex items-center transition">
        <i class="bi bi-bar-chart-line mr-1.5"></i> Laporan Publik
      </a>
    </div>
  </header>

  <!-- KONTEN UTAMA FORM LOGIN -->
  <main class="max-w-md mx-auto px-4 py-12 w-full flex-grow flex flex-col justify-center">
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-100">
      
      <!-- HEADER CARD -->
      <div class="p-6 text-center border-b border-slate-100 bg-slate-50/50">
        <h2 class="text-2xl font-extrabold text-slate-800">Selamat Datang</h2>
        <p class="text-sm text-slate-500 mt-1">Silakan pilih jenis akun dan login ke dalam sistem</p>
      </div>

      <!-- TAB NAVIGATION -->
      <div class="p-6">
        <div class="flex rounded-xl bg-slate-100 p-1 mb-6">
          <button id="tab-siswa-btn" onclick="switchTab('siswa')" class="flex-1 py-2.5 text-sm font-semibold rounded-lg text-white bg-blue-900 shadow transition flex items-center justify-center">
            <i class="bi bi-mortarboard-fill mr-2"></i> Siswa
          </button>
          <button id="tab-guru-btn" onclick="switchTab('guru')" class="flex-1 py-2.5 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition flex items-center justify-center">
            <i class="bi bi-person-badge-fill mr-2"></i> Guru / Petugas
          </button>
        </div>

        <!-- FORM SISWA -->
        <form id="form-siswa" onsubmit="loginSiswa(event)" class="space-y-4">
          <div>
            <label for="siswa-nisn" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">NISN SISWA</label>
            <div class="relative">
              <input type="text" id="siswa-nisn" required placeholder="Masukkan NISN..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 text-slate-800 text-sm transition" />
            </div>
          </div>

          <div>
            <label for="siswa-password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">PASSWORD</label>
            <div class="relative">
              <input type="password" id="siswa-password" required placeholder="Default: yhan123" class="w-full pl-4 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 text-slate-800 text-sm transition" />
              <button type="button" onclick="togglePassword('siswa-password', 'eye-siswa')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1 focus:outline-none">
                <i id="eye-siswa" class="bi bi-eye-slash text-lg"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="btn-login-siswa" class="w-full mt-2 py-3.5 bg-blue-900 hover:bg-blue-800 text-white font-semibold rounded-xl shadow-lg shadow-blue-900/20 hover:shadow-blue-900/40 transition flex items-center justify-center space-x-2 text-sm">
            <i class="bi bi-box-arrow-in-right"></i>
            <span>Masuk Akun Siswa</span>
          </button>
        </form>

        <!-- FORM GURU / PETUGAS -->
        <form id="form-guru" onsubmit="loginGuru(event)" class="space-y-4 hidden">
          <div>
            <label for="guru-username" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">USERNAME / NIP</label>
            <div class="relative">
              <input type="text" id="guru-username" required placeholder="Masukkan Username / NIP..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 text-slate-800 text-sm transition" />
            </div>
          </div>

          <div>
            <label for="guru-password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">PASSWORD</label>
            <div class="relative">
              <input type="password" id="guru-password" required placeholder="Masukkan Password..." class="w-full pl-4 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 text-slate-800 text-sm transition" />
              <button type="button" onclick="togglePassword('guru-password', 'eye-guru')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1 focus:outline-none">
                <i id="eye-guru" class="bi bi-eye-slash text-lg"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="btn-login-guru" class="w-full mt-2 py-3.5 bg-blue-900 hover:bg-blue-800 text-white font-semibold rounded-xl shadow-lg shadow-blue-900/20 hover:shadow-blue-900/40 transition flex items-center justify-center space-x-2 text-sm">
            <i class="bi bi-box-arrow-in-right"></i>
            <span>Masuk Akun Guru / Petugas</span>
          </button>
        </form>

      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-950 text-slate-500 text-xs text-center py-4 border-t border-slate-900">
    <p>&copy; 2026 SMAN 2 Karanganyar. All rights reserved.</p>
  </footer>

  <!-- CONFIG & SCRIPTS -->
  <script src="js/config.js?v=3"></script>
  <script>
    // URL Backend API
    const GET_API_URL = () => (typeof API_URL !== 'undefined') 
      ? API_URL 
      : 'https://smada-backend-api.yhanedy.workers.dev';

    // Switch Tab Siswa vs Guru
    function switchTab(type) {
      const formSiswa = document.getElementById('form-siswa');
      const formGuru = document.getElementById('form-guru');
      const btnSiswa = document.getElementById('tab-siswa-btn');
      const btnGuru = document.getElementById('tab-guru-btn');

      if (type === 'siswa') {
        formSiswa.classList.remove('hidden');
        formGuru.classList.add('hidden');
        btnSiswa.className = 'flex-1 py-2.5 text-sm font-semibold rounded-lg text-white bg-blue-900 shadow transition flex items-center justify-center';
        btnGuru.className = 'flex-1 py-2.5 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition flex items-center justify-center';
      } else {
        formGuru.classList.remove('hidden');
        formSiswa.classList.add('hidden');
        btnGuru.className = 'flex-1 py-2.5 text-sm font-semibold rounded-lg text-white bg-blue-900 shadow transition flex items-center justify-center';
        btnSiswa.className = 'flex-1 py-2.5 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition flex items-center justify-center';
      }
    }

    // Toggle Visibility Password
    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!input) return;

      if (input.type === 'password') {
        input.type = 'text';
        if (icon) {
          icon.classList.remove('bi-eye-slash');
          icon.classList.add('bi-eye');
        }
      } else {
        input.type = 'password';
        if (icon) {
          icon.classList.remove('bi-eye');
          icon.classList.add('bi-eye-slash');
        }
      }
    }

    // Process Login Siswa
    async function loginSiswa(e) {
      if (e) e.preventDefault();

      const nisn = document.getElementById('siswa-nisn').value.trim();
      const password = document.getElementById('siswa-password').value.trim();
      const btn = document.getElementById('btn-login-siswa');

      if (!nisn || !password) return alert('Silakan isi NISN dan Password terlebih dahulu!');

      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="bi bi-arrow-repeat animate-spin"></i><span>Memeriksa...</span>';
      }

      try {
        const res = await fetch(`${GET_API_URL()}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: nisn, password: password })
        });

        const data = await res.json();

        if (data.success && data.type === 'siswa') {
          localStorage.setItem('smada_user', JSON.stringify(data.user));
          localStorage.setItem('smada_role', 'siswa');
          alert(`Selamat datang, ${data.user.nama}!`);
          window.location.href = 'siswa.html';
        } else {
          alert(data.message || 'NISN atau Password Salah!');
        }
      } catch (err) {
        console.error('Error Login Siswa:', err);
        alert('Gagal terhubung ke server backend API.');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i><span>Masuk Akun Siswa</span>';
        }
      }
    }

    // Process Login Guru
    async function loginGuru(e) {
      if (e) e.preventDefault();

      const username = document.getElementById('guru-username').value.trim();
      const password = document.getElementById('guru-password').value.trim();
      const btn = document.getElementById('btn-login-guru');

      if (!username || !password) return alert('Silakan isi Username/NIP dan Password terlebih dahulu!');

      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="bi bi-arrow-repeat animate-spin"></i><span>Memeriksa...</span>';
      }

      try {
        const res = await fetch(`${GET_API_URL()}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        });

        const data = await res.json();

        if (data.success && data.type === 'guru') {
          const user = data.user;
          localStorage.setItem('smada_user', JSON.stringify(user));
          localStorage.setItem('smada_role', user.role);
          alert(`Selamat datang, ${user.nama}!`);

          // Directing sesuai Role
          if (user.role.includes('admin') || user.role.includes('superadmin')) {
            window.location.href = 'admin.html';
          } else if (user.role.includes('piket')) {
            window.location.href = 'piket.html';
          } else if (user.role.includes('bk')) {
            window.location.href = 'bk.html';
          } else {
            window.location.href = 'piket.html';
          }
        } else {
          alert(data.message || 'Username/NIP atau Password Salah!');
        }
      } catch (err) {
        console.error('Error Login Guru:', err);
        alert('Gagal terhubung ke server backend API.');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i><span>Masuk Akun Guru / Petugas</span>';
        }
      }
    }
  </script>
</body>
</html>
